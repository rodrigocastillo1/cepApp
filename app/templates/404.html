{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<section class="empty-state panel">
  <span class="empty-icon" aria-hidden="true">?</span>
  <span class="eyebrow">Not found</span>
  <h1>We couldn't find that page</h1>
  <p>The product ID may not be in the current demo catalogue.</p>
  <a class="button button-primary" href="{{ url_for('main.index') }}">Return to product search</a>
</section>
{% endblock %}
